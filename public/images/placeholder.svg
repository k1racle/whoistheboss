<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder image</title>
  <desc id="desc">Neutral placeholder image used when no media is available.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#9ca3af" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <rect x="210" y="180" width="780" height="540" rx="36"/>
    <path d="M300 600l170-170 140 140 95-95 195 195"/>
    <circle cx="445" cy="340" r="56"/>
  </g>
  <text x="600" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" fill="#6b7280">
    NO IMAGE
  </text>
</svg>
